[package]
name = "mapleblox-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Mapleblox diagnostics: memory budget, FFlag validation and live benchmark"
license = "Apache-2.0"

[[bin]]
name = "mapleblox-tool"
path = "src/main.rs"

[dependencies]
mapleblox-policy = { path = "../policy" }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"